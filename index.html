<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>✨ UnicornFlap ✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff6eb4;
    --purple: #a855f7;
    --cyan: #22d3ee;
    --gold: #fbbf24;
    --white: #fff;
  }

  body {
    background: #1a0030;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    touch-action: none;
  }

  #gameWrapper {
    position: relative;
    width: min(430px, 100vw);
    height: min(760px, 100dvh);
    overflow: hidden;
    border-radius: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 20px 0;
    pointer-events: none;
    z-index: 10;
  }

  #scoreDisplay {
    font-family: 'Fredoka One', cursive;
    font-size: 52px;
    color: #fff;
    text-shadow: 0 0 20px var(--pink), 0 3px 0 rgba(0,0,0,0.4);
    line-height: 1;
  }

  #bestDisplay {
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: var(--gold);
    text-align: right;
    text-shadow: 0 0 10px var(--gold);
    line-height: 1.3;
  }

  /* Screens */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 0.4s ease;
  }

  .screen.hidden { opacity: 0; pointer-events: none; }

  /* Start screen */
  #startScreen {
    background: linear-gradient(180deg, #2d0060 0%, #0a0020 100%);
  }

  .game-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(48px, 12vw, 72px);
    background: linear-gradient(135deg, #ff6eb4, #a855f7, #22d3ee, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(168,85,247,0.8));
    text-align: center;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 50px;
  }

  .tap-btn {
    background: linear-gradient(135deg, #ff6eb4, #a855f7);
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    border: none;
    border-radius: 50px;
    padding: 16px 60px;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(168,85,247,0.6), 0 6px 20px rgba(0,0,0,0.4);
    animation: pulse 1.8s ease-in-out infinite;
    touch-action: manipulation;
  }

  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 40px rgba(168,85,247,0.6), 0 6px 20px rgba(0,0,0,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,110,180,0.9), 0 8px 30px rgba(0,0,0,0.5); }
  }

  .medals-row {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    font-size: 36px;
  }

  /* Game Over screen */
  #gameOverScreen {
    background: rgba(10, 0, 32, 0.88);
    backdrop-filter: blur(6px);
  }

  .over-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(42px, 10vw, 64px);
    background: linear-gradient(135deg, #ff6eb4, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin-bottom: 24px;
    filter: drop-shadow(0 0 20px rgba(255,110,180,0.7));
  }

  .score-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 24px 48px;
    text-align: center;
    margin-bottom: 32px;
    min-width: 220px;
  }

  .score-card .label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .score-card .value {
    font-family: 'Fredoka One', cursive;
    font-size: 56px;
    color: #fff;
    text-shadow: 0 0 20px var(--pink);
    line-height: 1;
  }

  .score-card .best-val {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--gold);
    text-shadow: 0 0 10px var(--gold);
    margin-top: 8px;
  }

  .new-best-badge {
    font-size: 13px;
    background: linear-gradient(90deg, var(--gold), #ff6eb4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: sparkle-anim 0.6s ease-in-out infinite alternate;
  }

  @keyframes sparkle-anim {
    from { filter: drop-shadow(0 0 4px var(--gold)); }
    to { filter: drop-shadow(0 0 16px #ff6eb4); }
  }

  /* Decorative stars on start */
  .deco-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .deco-star {
    position: absolute;
    width: 3px; height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    opacity: var(--op, 0.6);
  }

  @keyframes twinkle {
    0%,100% { opacity: var(--op, 0.6); transform: scale(1); }
    50% { opacity: 1; transform: scale(2); }
  }
</style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="scoreDisplay">0</div>
    <div id="bestDisplay">BEST<br><span id="bestVal">0</span></div>
  </div>

  <!-- Start Screen -->
  <div class="screen" id="startScreen">
    <div class="deco-stars" id="decoStars"></div>
    <div class="game-title">🦄 Unicorn<br>Flap!</div>
    <div class="subtitle">✦ magical adventure ✦</div>
    <div class="medals-row">🌈 ✨ 🦄 ✨ 🌈</div>
    <button class="tap-btn" id="startBtn">TAP TO FLY!</button>
    <p style="color:rgba(255,255,255,0.3);font-size:12px;margin-top:20px;letter-spacing:1px;">TAP OR SPACE TO FLAP</p>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameOverScreen">
    <div class="over-title">Oh Neigh! 🐴</div>
    <div class="score-card">
      <div class="label">Score</div>
      <div class="value" id="finalScore">0</div>
      <div class="best-val">🏆 Best: <span id="finalBest">0</span></div>
      <div class="new-best-badge" id="newBestBadge" style="display:none">✦ NEW RECORD! ✦</div>
    </div>
    <button class="tap-btn" id="retryBtn">TRY AGAIN! ✨</button>
  </div>
</div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const W = 430, H = 760;
const GRAVITY = 0.38;
const FLAP_FORCE = -8.2;
const PIPE_SPEED = 2.8;
const PIPE_GAP = 195;
const PIPE_INTERVAL = 1800;
const GROUND_H = 80;

// ─── STATE ────────────────────────────────────────────────────────────────────
let score = 0, bestScore = parseInt(localStorage.getItem('uf_best') || '0');
let gameState = 'start'; // start | playing | dead
let lastTime = 0, pipeTimer = 0;
let unicorn, pipes, particles, rainbowTrail, stars, clouds;

// ─── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// ─── AUDIO ENGINE ─────────────────────────────────────────────────────────────
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, dur, vol = 0.3, delay = 0) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime + delay);
    gain.gain.setValueAtTime(0, ac.currentTime + delay);
    gain.gain.linearRampToValueAtTime(vol, ac.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + dur);
    osc.start(ac.currentTime + delay);
    osc.stop(ac.currentTime + delay + dur + 0.05);
  } catch(e) {}
}

function sfxFlap() {
  playTone(620, 'sine', 0.12, 0.25);
  playTone(780, 'sine', 0.08, 0.15, 0.05);
}

function sfxScore() {
  [523, 659, 784, 1047].forEach((f, i) => playTone(f, 'sine', 0.18, 0.22, i * 0.07));
}

function sfxDie() {
  playTone(300, 'sawtooth', 0.08, 0.3);
  playTone(200, 'sawtooth', 0.15, 0.3, 0.08);
  playTone(120, 'square', 0.25, 0.3, 0.2);
}

// Background music via oscillators
let bgNodes = [];
function startBGMusic() {
  stopBGMusic();
  try {
    const ac = getAudio();
    // Dreamy pad: slow arpeggiated chord
    const melody = [523.25, 659.25, 783.99, 1046.5, 783.99, 659.25];
    const master = ac.createGain();
    master.gain.setValueAtTime(0.07, ac.currentTime);
    master.connect(ac.destination);
    bgNodes.push(master);

    // bass drone
    const bass = ac.createOscillator();
    const bassGain = ac.createGain();
    bass.type = 'sine';
    bass.frequency.value = 130.81;
    bassGain.gain.value = 0.12;
    bass.connect(bassGain); bassGain.connect(master);
    bass.start(); bgNodes.push(bass, bassGain);

    // sparkle arp
    melody.forEach((f, i) => {
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      g.gain.value = 0;
      osc.connect(g); g.connect(master);
      osc.start();
      bgNodes.push(osc, g);

      // schedule repeating fades
      function scheduleNote(t) {
        const period = melody.length * 0.55;
        const noteT = t + i * 0.55;
        g.gain.setValueAtTime(0, noteT);
        g.gain.linearRampToValueAtTime(0.5, noteT + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, noteT + 0.45);
        setTimeout(() => { try { scheduleNote(ac.currentTime + period - (i * 0.55)); } catch(e){} }, (period) * 1000);
      }
      scheduleNote(ac.currentTime + i * 0.55);
    });
  } catch(e) {}
}

function stopBGMusic() {
  bgNodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch(e){} });
  bgNodes = [];
}

// ─── INIT OBJECTS ─────────────────────────────────────────────────────────────
function initGame() {
  score = 0;
  pipes = [];
  particles = [];
  pipeTimer = 0;

  unicorn = {
    x: W * 0.25,
    y: H * 0.45,
    vy: 0,
    r: 28,
    angle: 0,
    wingPhase: 0,
    alive: true,
    trailPoints: []
  };

  rainbowTrail = [];

  document.getElementById('scoreDisplay').textContent = '0';
}

function initStars() {
  stars = Array.from({length: 80}, () => ({
    x: Math.random() * W,
    y: Math.random() * (H - GROUND_H),
    r: Math.random() * 2 + 0.5,
    twinkle: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.02 + 0.005
  }));
}

function initClouds() {
  clouds = Array.from({length: 6}, (_, i) => ({
    x: Math.random() * W,
    y: 60 + Math.random() * 200,
    w: 80 + Math.random() * 60,
    speed: 0.3 + Math.random() * 0.3,
    alpha: 0.15 + Math.random() * 0.15
  }));
}

// ─── PARTICLE SYSTEM ──────────────────────────────────────────────────────────
const RAINBOW_COLORS = ['#ff6eb4','#ff9e4f','#ffd700','#6dff6d','#4fc3f7','#a855f7','#ff6eb4'];

function spawnSparkles(x, y, count, spread = 40) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3;
    particles.push({
      type: 'sparkle',
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: 0.025 + Math.random() * 0.02,
      size: 3 + Math.random() * 5,
      color: RAINBOW_COLORS[Math.floor(Math.random() * RAINBOW_COLORS.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3
    });
  }
}

function spawnScoreParticles(x, y) {
  // rainbow burst on score
  for (let i = 0; i < 30; i++) {
    const angle = (i / 30) * Math.PI * 2;
    const speed = 3 + Math.random() * 4;
    particles.push({
      type: 'star',
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02,
      size: 6 + Math.random() * 6,
      color: RAINBOW_COLORS[i % RAINBOW_COLORS.length],
      rotation: 0,
      rotSpeed: 0.2
    });
  }
}

function spawnDeathExplosion(x, y) {
  spawnSparkles(x, y, 60, 60);
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    particles.push({
      type: 'ring', x, y,
      vx: Math.cos(angle) * (2 + Math.random() * 3),
      vy: Math.sin(angle) * (2 + Math.random() * 3),
      life: 1, decay: 0.018,
      size: 8, color: '#fff',
      rotation: 0, rotSpeed: 0
    });
  }
}

// ─── DRAWING ──────────────────────────────────────────────────────────────────
function drawBackground(dt) {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  sky.addColorStop(0, '#0d0025');
  sky.addColorStop(0.5, '#1a0050');
  sky.addColorStop(1, '#2d0060');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H - GROUND_H);

  // Stars
  stars.forEach(s => {
    s.twinkle += s.speed;
    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Clouds
  clouds.forEach(c => {
    if (gameState === 'playing') c.x -= c.speed;
    if (c.x + c.w < 0) c.x = W + c.w;
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = '#c8a0ff';
    // fluffy cloud shape
    const cx = c.x, cy = c.y, w = c.w;
    ctx.beginPath();
    ctx.arc(cx, cy, w * 0.35, 0, Math.PI * 2);
    ctx.arc(cx + w * 0.3, cy - w * 0.1, w * 0.28, 0, Math.PI * 2);
    ctx.arc(cx + w * 0.55, cy, w * 0.25, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawGround() {
  // ground
  const grd = ctx.createLinearGradient(0, H - GROUND_H, 0, H);
  grd.addColorStop(0, '#5c0a8c');
  grd.addColorStop(0.3, '#3d0060');
  grd.addColorStop(1, '#1a0030');
  ctx.fillStyle = grd;
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);

  // glowing line
  ctx.strokeStyle = '#ff6eb4';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ff6eb4';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, H - GROUND_H);
  ctx.lineTo(W, H - GROUND_H);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // sparkle ground deco
  for (let x = 20; x < W; x += 40) {
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(Date.now() * 0.001 + x);
    ctx.fillStyle = '#a855f7';
    ctx.beginPath();
    ctx.arc(x, H - GROUND_H + 8, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRainbowTrail() {
  if (rainbowTrail.length < 2) return;
  for (let i = 1; i < rainbowTrail.length; i++) {
    const p = rainbowTrail[i - 1], q = rainbowTrail[i];
    const alpha = (i / rainbowTrail.length) * 0.7;
    const colorIdx = Math.floor((i / rainbowTrail.length) * RAINBOW_COLORS.length);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = RAINBOW_COLORS[colorIdx % RAINBOW_COLORS.length];
    ctx.lineWidth = 4 * (i / rainbowTrail.length) + 1;
    ctx.lineCap = 'round';
    ctx.shadowColor = RAINBOW_COLORS[colorIdx % RAINBOW_COLORS.length];
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function drawPipes() {
  pipes.forEach(pipe => {
    // Top pipe
    drawPipe(pipe.x, 0, PIPE_W, pipe.topH, true);
    // Bottom pipe
    const botY = pipe.topH + PIPE_GAP;
    drawPipe(pipe.x, botY, PIPE_W, H - GROUND_H - botY, false);

    // Rainbow between pipes (gap indicator)
    if (!pipe.scored) {
      const cx = pipe.x + PIPE_W / 2;
      const midY = pipe.topH + PIPE_GAP / 2;
      ctx.globalAlpha = 0.12;
      const rg = ctx.createLinearGradient(cx - 10, pipe.topH, cx - 10, botY);
      RAINBOW_COLORS.forEach((c, i) => rg.addColorStop(i / (RAINBOW_COLORS.length - 1), c));
      ctx.fillStyle = rg;
      ctx.fillRect(cx - 10, pipe.topH, 20, PIPE_GAP);
      ctx.globalAlpha = 1;
    }
  });
}

const PIPE_W = 72;

function drawPipe(x, y, w, h, isTop) {
  // Pipe body
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, '#1a0050');
  grad.addColorStop(0.3, '#6d28d9');
  grad.addColorStop(0.7, '#a855f7');
  grad.addColorStop(1, '#2d0060');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  // Glow edge
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#a855f7';
  ctx.shadowBlur = 14;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.shadowBlur = 0;

  // Cap
  const capH = 22, capExtra = 8;
  const capY = isTop ? y + h - capH : y;
  ctx.fillStyle = '#7c3aed';
  ctx.fillRect(x - capExtra, capY, w + capExtra * 2, capH);
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#c084fc';
  ctx.shadowBlur = 10;
  ctx.strokeRect(x - capExtra, capY, w + capExtra * 2, capH);
  ctx.shadowBlur = 0;

  // Sparkles along edge
  for (let sy = y + 10; sy < y + h - 10; sy += 50) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() * 0.002 + sy);
    ctx.fillStyle = '#e879f9';
    ctx.beginPath();
    ctx.arc(x + w - 4, sy, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawUnicorn() {
  const u = unicorn;
  ctx.save();
  ctx.translate(u.x, u.y);
  ctx.rotate(u.angle);

  const t = Date.now() * 0.01;
  u.wingPhase += 0.18;

  // Glow aura
  const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, u.r * 2);
  aura.addColorStop(0, 'rgba(168,85,247,0.5)');
  aura.addColorStop(0.5, 'rgba(255,110,180,0.2)');
  aura.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(0, 0, u.r * 2, 0, Math.PI * 2);
  ctx.fill();

  // Wings
  const wingFlap = Math.sin(u.wingPhase) * 18;
  drawWing(ctx, -8, -10, wingFlap, false); // top wing
  drawWing(ctx, -8, 10, -wingFlap, true);  // bottom wing

  // Body
  ctx.fillStyle = '#fff0fc';
  ctx.shadowColor = '#ff6eb4';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.ellipse(0, 0, u.r, u.r * 0.78, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Belly shine
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.ellipse(2, -4, 10, 7, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Mane - rainbow streaks
  RAINBOW_COLORS.slice(0, 5).forEach((c, i) => {
    ctx.strokeStyle = c;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.85;
    ctx.shadowColor = c;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.moveTo(u.r * 0.5 - i * 3, -u.r * 0.6 + i * 3);
    ctx.quadraticCurveTo(u.r * 0.3, -u.r * 1.1 + i * 2, u.r * 0.1 - i * 2, -u.r * 0.5 + i * 4);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Horn
  ctx.fillStyle = '#fbbf24';
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(u.r * 0.6, -14);
  ctx.lineTo(u.r * 1.5, -2);
  ctx.lineTo(u.r * 0.6, 2);
  ctx.closePath();
  ctx.fill();

  // Horn glitter
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 8;
  for (let i = 0; i < 3; i++) {
    const lx = u.r * 0.75 + i * 0.22 * u.r;
    ctx.beginPath();
    ctx.moveTo(lx, -10 + i * 4);
    ctx.lineTo(lx + 8, -14 + i * 3);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // Eyes
  ctx.fillStyle = '#1a0030';
  ctx.beginPath();
  ctx.arc(u.r * 0.5, -6, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(u.r * 0.5 + 1.5, -7, 2, 0, Math.PI * 2);
  ctx.fill();

  // Eyelash
  ctx.strokeStyle = '#ff6eb4';
  ctx.lineWidth = 1.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(u.r * 0.5 + i * 3, -11);
    ctx.lineTo(u.r * 0.5 + i * 3 + i, -15);
    ctx.stroke();
  }

  // Blush
  ctx.globalAlpha = 0.4;
  ctx.fillStyle = '#ff6eb4';
  ctx.beginPath();
  ctx.ellipse(u.r * 0.35, 4, 7, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawWing(ctx, ox, oy, flap, flip) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(1, flip ? -1 : 1);
  ctx.rotate(flap * Math.PI / 180);

  const wGrad = ctx.createLinearGradient(-30, 0, 10, 0);
  wGrad.addColorStop(0, 'rgba(168,85,247,0.9)');
  wGrad.addColorStop(0.5, 'rgba(255,110,180,0.8)');
  wGrad.addColorStop(1, 'rgba(255,255,255,0.5)');
  ctx.fillStyle = wGrad;
  ctx.shadowColor = '#a855f7';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-20, -25, -50, -15, -45, 5);
  ctx.bezierCurveTo(-30, 15, -10, 10, 0, 0);
  ctx.fill();

  // feather lines
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-i * 12 - 5, 0);
    ctx.lineTo(-i * 12 - 15, -14);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;

    if (p.type === 'sparkle') {
      // 4-point star
      ctx.fillStyle = p.color;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        const r1 = p.size, r2 = p.size * 0.35;
        const a2 = a + Math.PI / 4;
        ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
        ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
      }
      ctx.closePath();
      ctx.fill();
    } else {
      // circle for ring/star type
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  });
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────
function spawnPipe() {
  const minTop = 80, maxTop = H - GROUND_H - PIPE_GAP - 80;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W + 20, topH, scored: false });
}

function flap() {
  if (gameState === 'dead') return;
  if (gameState === 'start') {
    gameState = 'playing';
    document.getElementById('startScreen').classList.add('hidden');
    startBGMusic();
  }
  unicorn.vy = FLAP_FORCE;
  sfxFlap();
  spawnSparkles(unicorn.x - 20, unicorn.y, 8);
}

function checkCollision() {
  const u = unicorn;
  const r = u.r * 0.72; // slightly forgiving hitbox

  // Ground / ceiling
  if (u.y + r > H - GROUND_H || u.y - r < 0) return true;

  // Pipes
  for (const pipe of pipes) {
    const px = pipe.x, pw = PIPE_W;
    const capExtra = 8;
    if (u.x + r > px - capExtra && u.x - r < px + pw + capExtra) {
      if (u.y - r < pipe.topH || u.y + r > pipe.topH + PIPE_GAP) return true;
    }
  }
  return false;
}

function die() {
  unicorn.alive = false;
  gameState = 'dead';
  sfxDie();
  stopBGMusic();
  spawnDeathExplosion(unicorn.x, unicorn.y);

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('uf_best', bestScore);
  }

  setTimeout(() => {
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = bestScore;
    document.getElementById('bestVal').textContent = bestScore;
    const newBest = document.getElementById('newBestBadge');
    newBest.style.display = score >= bestScore && score > 0 ? 'block' : 'none';
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }, 900);
}

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
function update(dt) {
  if (gameState !== 'playing') return;

  // Unicorn physics
  unicorn.vy += GRAVITY;
  unicorn.y += unicorn.vy;
  unicorn.angle = Math.max(-0.5, Math.min(1.2, unicorn.vy * 0.065));

  // Rainbow trail
  rainbowTrail.push({ x: unicorn.x - 10, y: unicorn.y });
  if (rainbowTrail.length > 28) rainbowTrail.shift();

  // Passive sparkles
  if (Math.random() < 0.3) {
    spawnSparkles(unicorn.x + (Math.random() - 0.5) * 30, unicorn.y + (Math.random() - 0.5) * 20, 1);
  }

  // Pipes
  pipeTimer += dt;
  if (pipeTimer > PIPE_INTERVAL) { spawnPipe(); pipeTimer = 0; }

  pipes.forEach(pipe => { pipe.x -= PIPE_SPEED; });
  pipes = pipes.filter(p => p.x > -PIPE_W - 20);

  // Scoring
  pipes.forEach(pipe => {
    if (!pipe.scored && pipe.x + PIPE_W < unicorn.x) {
      pipe.scored = true;
      score++;
      document.getElementById('scoreDisplay').textContent = score;
      document.getElementById('bestVal').textContent = Math.max(bestScore, score);
      sfxScore();
      spawnScoreParticles(unicorn.x + 60, unicorn.y);
    }
  });

  // Particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06;
    p.life -= p.decay;
    p.rotation += p.rotSpeed;
  });
  particles = particles.filter(p => p.life > 0);

  // Collision
  if (checkCollision()) die();
}

function render(dt) {
  ctx.clearRect(0, 0, W, H);
  drawBackground(dt);
  drawRainbowTrail();
  drawPipes();
  drawGround();
  if (unicorn) drawUnicorn();
  drawParticles();
}

function loop(ts) {
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;

  // Always update particles and render even on dead/start for effects
  if (gameState !== 'start') {
    update(dt);
  }
  render(dt);
  requestAnimationFrame(loop);
}

// ─── INPUTS ───────────────────────────────────────────────────────────────────
function handleTap(e) {
  e && e.preventDefault();
  if (gameState === 'start' || gameState === 'playing') flap();
}

canvas.addEventListener('touchstart', handleTap, { passive: false });
canvas.addEventListener('mousedown', handleTap);
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleTap(); } });

document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); handleTap(); });
document.getElementById('retryBtn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('gameOverScreen').classList.add('hidden');
  initGame();
  gameState = 'playing';
  startBGMusic();
});

// ─── DECO STARS ON START SCREEN ───────────────────────────────────────────────
function buildDecoStars() {
  const container = document.getElementById('decoStars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'deco-star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
    s.style.setProperty('--op', (0.3 + Math.random() * 0.7).toFixed(2));
    s.style.animationDelay = (Math.random() * 4) + 's';
    container.appendChild(s);
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
buildDecoStars();
initStars();
initClouds();
initGame();
document.getElementById('bestVal').textContent = bestScore;

lastTime = performance.now();
requestAnimationFrame(loop);
</script>
